<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">System profile for Puneet M P Bharadwaj</title>
  <desc id="desc">Premium cyber-terminal identity card using Puneet's actual GitHub profile avatar.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#12301f" opacity=".23"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="avatar-clip"><circle cx="208" cy="246" r="128"/></clipPath>
  </defs>
  <rect width="1200" height="500" rx="4" fill="#050805"/>
  <rect x="1" y="1" width="1198" height="498" rx="4" fill="none" stroke="#1d3d29"/>
  <rect width="1200" height="500" fill="url(#grid)"/>

  <g font-family="monospace, Courier New">
    <text x="30" y="39" fill="#39ff14" font-size="14" letter-spacing="2">01 // SYSTEM PROFILE</text>
    <circle cx="1080" cy="34" r="4" fill="#39ff14" filter="url(#glow)"><animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <text x="1096" y="39" fill="#39ff14" font-size="12">ONLINE</text>
    <path d="M30 52h1140" stroke="#173b27"/>
  </g>

  <g aria-label="GitHub profile avatar">
    <circle cx="208" cy="246" r="148" fill="#07100a" stroke="#173b27"/>
    <circle cx="208" cy="246" r="139" fill="none" stroke="#00f5ff" stroke-width="1" opacity=".65"/>
    <circle cx="208" cy="246" r="133" fill="none" stroke="#39ff14" stroke-width="2" filter="url(#glow)"/>
    <image href="profile-avatar.png" x="80" y="118" width="256" height="256" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-clip)"/>
    <path d="M65 136v-34h34M317 102h34v34M65 356v34h34M317 390h34v-34" fill="none" stroke="#00f5ff" stroke-width="2" opacity=".75"/>
    <path d="M208 84v18M208 390v18M46 246h18M352 246h18" stroke="#39ff14" opacity=".8"/>
    <rect x="108" y="399" width="200" height="28" fill="#07100a" stroke="#20452d"/>
    <text x="208" y="418" text-anchor="middle" fill="#6b7280" font-family="monospace, Courier New" font-size="10" letter-spacing="2">GITHUB ID // 208438285</text>
  </g>

  <g transform="translate(410 84)" font-family="monospace, Courier New">
    <text x="0" y="31" fill="#e6edf3" font-size="31" font-weight="700" letter-spacing="2">PUNEET M P BHARADWAJ</text>
    <text x="0" y="61" fill="#39ff14" font-size="16">@Puneet-2005</text>
    <path d="M0 78h742" stroke="#173b27"/>
    <text x="0" y="112" fill="#00f5ff" font-size="18" letter-spacing="2">SOFTWARE ENGINEER</text>
    <text x="0" y="140" fill="#9aa4b2" font-size="14">AI // BACKEND // SYSTEMS // DEVELOPER TOOLS</text>

    <g transform="translate(0 169)">
      <rect width="232" height="82" fill="#070b08" stroke="#20452d"/>
      <text x="16" y="25" fill="#6b7280" font-size="10" letter-spacing="2">LOCATION</text>
      <text x="16" y="55" fill="#e6edf3" font-size="14">Bengaluru, India</text>
      <circle cx="208" cy="22" r="3" fill="#39ff14"/>
    </g>
    <g transform="translate(248 169)">
      <rect width="494" height="82" fill="#070b08" stroke="#20452d"/>
      <text x="16" y="25" fill="#6b7280" font-size="10" letter-spacing="2">INTERESTS</text>
      <text x="16" y="55" fill="#e6edf3" font-size="14">AI • Backend • Systems • Developer Tools</text>
      <circle cx="470" cy="22" r="3" fill="#00f5ff"/>
    </g>
    <g transform="translate(0 267)">
      <rect width="742" height="72" fill="#070b08" stroke="#20452d"/>
      <text x="16" y="24" fill="#6b7280" font-size="10" letter-spacing="2">LANGUAGES</text>
      <text x="16" y="51" fill="#e6edf3" font-size="14">Python  •  C++  •  Java  •  TypeScript</text>
      <path d="M574 22h140" stroke="#173b27"/><path d="M574 22h91" stroke="#a855f7" opacity=".7"/>
    </g>
  </g>

  <g transform="translate(30 446)" font-family="monospace, Courier New">
    <rect width="1140" height="34" fill="#08100a" stroke="#173b27"/>
    <text x="16" y="22" fill="#6b7280" font-size="10">STATUS</text><text x="82" y="22" fill="#39ff14" font-size="12">ONLINE</text>
    <path d="M188 0v34M392 0v34" stroke="#173b27"/>
    <text x="206" y="22" fill="#6b7280" font-size="10">MODE</text><text x="256" y="22" fill="#00f5ff" font-size="12">ENGINEERING</text>
    <text x="410" y="22" fill="#6b7280" font-size="10">MISSION</text><text x="476" y="22" fill="#e6edf3" font-size="12">BUILD USEFUL SOFTWARE</text>
    <text x="1120" y="22" text-anchor="end" fill="#39ff14" font-size="12">BUILD. UNDERSTAND. IMPROVE.</text>
  </g>
</svg>
