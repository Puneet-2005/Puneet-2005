<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Puneet M P Bharadwaj</title>
  <desc id="desc">Cyber-terminal header for a software engineer and AI builder in Bengaluru, India.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#163326" stroke-width="1" opacity=".32"/>
      <circle cx="0" cy="0" r="1" fill="#39ff14" opacity=".22"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset=".52" stop-color="#050805"/>
      <stop offset="1" stop-color="#080c0a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="380" rx="4" fill="url(#scan)"/>
  <rect x="1" y="1" width="1198" height="378" rx="4" fill="none" stroke="#20452d"/>
  <rect width="1200" height="380" fill="url(#grid)"/>
  <path d="M18 72V18h54M1128 18h54v54M18 308v54h54M1128 362h54v-54" fill="none" stroke="#39ff14" stroke-width="2" opacity=".7"/>
  <path d="M18 90v52M18 160v10M1182 90v84M18 290v-84M1182 290v-70" stroke="#00f5ff" opacity=".45"/>

  <g font-family="monospace, Courier New" letter-spacing="1">
    <text x="54" y="55" fill="#39ff14" font-size="16">&gt; SYSTEM PROFILE // PUNEET-2005</text>
    <circle cx="1128" cy="50" r="4" fill="#39ff14" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="1145" y="56" fill="#6b7280" font-size="12">LIVE</text>

    <text x="54" y="139" fill="#e6edf3" font-size="50" font-weight="700" letter-spacing="3">PUNEET M P BHARADWAJ</text>
    <rect x="54" y="157" width="700" height="2" fill="#39ff14" opacity=".7" filter="url(#glow)"/>
    <rect x="758" y="157" width="66" height="2" fill="#a855f7" opacity=".65"/>
    <text x="54" y="194" fill="#00f5ff" font-size="18">SOFTWARE ENGINEER // AI BUILDER // SYSTEMS EXPLORER</text>

    <text x="54" y="247" fill="#9aa4b2" font-size="14">&gt; INITIALIZING DEVELOPER PROFILE...</text>
    <text x="54" y="276" fill="#9aa4b2" font-size="14">&gt; LOCATION: <tspan fill="#e6edf3">BENGALURU, INDIA</tspan></text>
    <text x="54" y="305" fill="#9aa4b2" font-size="14">&gt; STATUS: <tspan fill="#39ff14">ONLINE</tspan><tspan fill="#39ff14">█<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="1s" repeatCount="indefinite"/></tspan></text>
  </g>

  <g transform="translate(845 94)" font-family="monospace, Courier New" font-size="13">
    <rect width="302" height="196" fill="#070b08" stroke="#173b27"/>
    <path d="M0 30h302M88 30v166" stroke="#173b27"/>
    <text x="14" y="20" fill="#6b7280" font-size="10" letter-spacing="2">RUNTIME // IDENTITY NODE</text>
    <text x="14" y="59" fill="#6b7280">SYS.ID</text><text x="105" y="59" fill="#e6edf3">PUNEET-2005</text>
    <text x="14" y="91" fill="#6b7280">BUILD</text><text x="105" y="91" fill="#39ff14">ACTIVE</text>
    <text x="14" y="123" fill="#6b7280">FOCUS</text><text x="105" y="123" fill="#00f5ff">AI × BACKEND</text>
    <text x="105" y="144" fill="#00f5ff">× SYSTEMS</text>
    <text x="14" y="176" fill="#6b7280">MISSION</text><text x="105" y="176" fill="#a855f7">SHIP SYSTEMS</text>
    <path d="M285 12h7v7M10 184v-7h7" fill="none" stroke="#39ff14"/>
  </g>
  <g opacity=".45" fill="#39ff14">
    <rect x="1080" y="325" width="6" height="6"/><rect x="1092" y="325" width="18" height="6"/><rect x="1116" y="325" width="6" height="6"/><rect x="1128" y="325" width="30" height="6"/>
    <rect x="1080" y="337" width="18" height="6"/><rect x="1104" y="337" width="6" height="6"/><rect x="1116" y="337" width="18" height="6"/><rect x="1140" y="337" width="18" height="6"/>
  </g>
</svg>
