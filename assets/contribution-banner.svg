<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="128" viewBox="0 0 1200 128" role="img" aria-labelledby="title desc">
  <title id="title">Development signal</title>
  <desc id="desc">Live GitHub contribution telemetry for Puneet-2005.</desc>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#163326" opacity=".25"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="128" rx="4" fill="#050805"/><rect x="1" y="1" width="1198" height="126" rx="4" fill="none" stroke="#1d3d29"/><rect width="1200" height="128" fill="url(#grid)"/>
  <path d="M28 22v84h12M1172 22v84h-12" fill="none" stroke="#39ff14"/>
  <g font-family="monospace, Courier New">
    <text x="54" y="48" fill="#39ff14" font-size="14" letter-spacing="2">04 // DEVELOPMENT SIGNAL</text>
    <text x="54" y="79" fill="#e6edf3" font-size="18">PUBLIC CONTRIBUTION TELEMETRY // LIVE DATA</text>
    <text x="54" y="103" fill="#6b7280" font-size="10">TOTAL CONTRIBUTIONS // CONTRIBUTION SNAKE // GITHUB PUBLIC PROFILE</text>
    <circle cx="1015" cy="62" r="5" fill="#39ff14" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="1032" y="67" fill="#39ff14" font-size="12">FEED ONLINE</text>
  </g>
  <g transform="translate(917 91)" fill="#1e5030"><rect width="18" height="5"/><rect x="24" width="30" height="5"/><rect x="60" width="10" height="5"/><rect x="76" width="44" height="5"/><rect x="126" width="22" height="5"/><rect x="154" width="54" height="5"/></g>
</svg>
