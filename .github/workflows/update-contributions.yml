name: Update contribution total

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-contributions-main
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.repository == 'Puneet-2005/Puneet-2005' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch public profile contribution total
        id: contributions
        shell: bash
        env:
          CONTRIBUTION_USER: Puneet-2005
        run: |
          # This is the panel GitHub renders on the public profile. Its displayed
          # total is the source of truth; the default GraphQL window can differ.
          total="$(
            python3 - <<'PY'
          import html
          import os
          import re
          import sys
          import urllib.request

          login = os.environ["CONTRIBUTION_USER"]
          url = f"https://github.com/users/{login}/contributions"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "text/html",
                  "Accept-Language": "en-US",
                  "User-Agent": "Puneet-2005-profile-contribution-card",
              },
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              page = response.read().decode("utf-8", "replace")

          visible_text = re.sub(r"<[^>]+>", " ", html.unescape(page))
          match = re.search(
              r"([0-9][0-9,]*)\s+contributions?\s+in\s+the\s+last\s+year",
              visible_text,
              re.IGNORECASE,
          )
          if match is None:
              print(
                  "Could not find GitHub's public 'contributions in the last year' total.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(match.group(1).replace(",", ""))
          PY
          )"

          if [[ ! "$total" =~ ^[0-9]+$ ]]; then
            echo "GitHub returned an invalid public profile contribution total: $total" >&2
            exit 1
          fi

          echo "total=$total" >> "$GITHUB_OUTPUT"

      - name: Render contribution card
        shell: bash
        run: >-
          python3 scripts/generate_contribution_card.py
          --count "${{ steps.contributions.outputs.total }}"
          --output assets/contribution-total.svg

      - name: Validate generated SVG
        shell: bash
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('assets/contribution-total.svg')"

      - name: Commit changed total
        shell: bash
        run: |
          git add -- assets/contribution-total.svg

          if git diff --cached --quiet -- assets/contribution-total.svg; then
            echo "Contribution total is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update contribution total"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
